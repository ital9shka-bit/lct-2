name: oop
x-app: &app
  build:
    context: ..
    dockerfile: implementation/Dockerfile
  image: ${APP_IMAGE:-oop-platform:local}
  environment: &env
    APP_ENV: ${APP_ENV:-demo}
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
    APP_SECRET: ${APP_SECRET:?Copy .env.example to .env and set APP_SECRET}
    AUTH_MODE: ${AUTH_MODE:-email}
    DEMO_PUBLIC: ${DEMO_PUBLIC:-false}
    TRUST_PROXY: ${TRUST_PROXY:-false}
    OIDC_ISSUER: ${OIDC_ISSUER:-}
    OIDC_INTERNAL_ISSUER: ${OIDC_INTERNAL_ISSUER:-}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-oop-web}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    DATABASE_URL: postgres://oop:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/oop
    PORT: 8088
    LLM_MODE: ${LLM_MODE:-manual}
    LLM_URL: ${LLM_URL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    MAIL_MODE: smtp
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  postgres:
    image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    environment:
      POSTGRES_USER: oop
      POSTGRES_DB: oop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U oop -d oop]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: [sh, -c, 'node src/migrate.mjs && if [ "$APP_ENV" = demo ]; then node src/seed.mjs; fi']
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:${APP_PORT:-8088}:8088"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8088/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
  worker:
    <<: *app
    command: [node, src/worker.mjs]
    depends_on:
      migrate: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
  mailpit:
    image: axllent/mailpit@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    ports: ["127.0.0.1:${MAILPIT_PORT:-8089}:8025"]
    restart: unless-stopped
volumes:
  postgres_data:
